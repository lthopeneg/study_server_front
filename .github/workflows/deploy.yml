name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main # main 브랜치에 코드가 push(또는 merge)될 때만 실행됩니다.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image for security scanning
        run: docker build --tag study-server-front:security-scan .

      - name: Block fixable high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: study-server-front:security-scan
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  # 1. GitHub에서 이미지를 빌드하고 GHCR에 업로드하는 작업
  build-and-push:
    needs: security-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GHCR에 이미지를 푸시하기 위한 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 깃허브에서 자동 발급하는 토큰 사용

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: APP_REVISION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

  # 2. 오라클 서버에 접속하여 이미지를 다운받고 실행하는 작업
  deploy:
    needs: build-and-push # 빌드 작업이 성공해야만 실행됨
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SS_HOST }}
          username: ${{ secrets.SS_USERNAME }}
          key: ${{ secrets.SS_KEY }}
          script_stop: true
          script: |
            set -eu
            # 1. 저장소 이름을 소문자로 강제 변환 (도커 이미지는 대문자를 허용하지 않음)
            IMAGE_URL="ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]'):${{ github.sha }}"

            # 2. GHCR 로그인 (서버 내부에서 프라이빗 이미지를 pull 받기 위함)
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 3. 최신 이미지 다운로드
            docker pull "$IMAGE_URL"
            docker image inspect "$IMAGE_URL" >/dev/null

            # Caddy가 컨테이너 이름으로 프론트엔드에 연결할 공용 네트워크를 보장합니다.
            docker network inspect study-network >/dev/null 2>&1 || docker network create study-network

            # 4. 기존 컨테이너 중지 및 삭제
            docker stop study-front-app || true
            docker rm study-front-app || true

            # 5. 외부 포트는 Caddy만 공개하고 프론트엔드는 전용 네트워크에서만 제공합니다.
            docker run -d --restart unless-stopped --network study-network --name study-front-app "$IMAGE_URL"

            EXPECTED_IMAGE_ID="$(docker image inspect "$IMAGE_URL" --format '{{.Id}}')"
            RUNNING_IMAGE_ID="$(docker inspect study-front-app --format '{{.Image}}')"
            test "$RUNNING_IMAGE_ID" = "$EXPECTED_IMAGE_ID"

            ATTEMPT=0
            VERIFIED=false
            while [ "$ATTEMPT" -lt 12 ]; do
              ATTEMPT=$((ATTEMPT + 1))
              if RESPONSE="$(curl -fsS --max-time 5 https://scspace.duckdns.org/version.json 2>/dev/null)" \
                && printf '%s' "$RESPONSE" | grep -Eq '"revision"[[:space:]]*:[[:space:]]*"${{ github.sha }}"'; then
                VERIFIED=true
                break
              fi
              sleep 3
            done
            test "$VERIFIED" = true

            # 6. 사용하지 않는 잉여 도커 이미지 및 캐시 청소 (서버 용량 확보)
            docker image prune -f
