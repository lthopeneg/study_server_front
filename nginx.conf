server {
    listen 80;

    # 브라우저 보안 정책. DuckDNS의 다른 하위 도메인에는 영향을 주지 않도록
    # HSTS includeSubDomains는 사용하지 않습니다.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob: https:; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    
    # Nginx가 파일들을 찾을 기본 경로
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # 요청된 URI가 파일이나 디렉토리로 존재하지 않으면 index.html로 라우팅
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location = /version.json {
        expires -1;
        try_files $uri =404;
    }

    # 미니 게임 진입 문서는 관리자 권한을 확인합니다. 해시가 포함된 정적 자산은
    # 별도 위치에서 제공해 이미지마다 인증용 DB 조회가 반복되지 않게 합니다.
    location = /_mini-game-admin-auth {
        internal;
        proxy_pass http://study-back-app:5000/api/notes;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    location = /mini-game {
        return 308 /mini-game/;
    }

    location = /mini-game/ {
        auth_request /_mini-game-admin-auth;
        expires -1;
        try_files /mini-game/index.html =404;
    }

    location = /mini-game/index.html {
        auth_request /_mini-game-admin-auth;
        expires -1;
        try_files $uri =404;
    }

    location ^~ /mini-game/assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 1y;
        try_files $uri =404;
    }
}
