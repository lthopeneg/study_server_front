server {
    listen 80;

    # 브라우저 보안 정책. DuckDNS의 다른 하위 도메인에는 영향을 주지 않도록
    # HSTS includeSubDomains는 사용하지 않습니다.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob: https:; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    
    # Nginx가 파일들을 찾을 기본 경로
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # 요청된 URI가 파일이나 디렉토리로 존재하지 않으면 index.html로 라우팅
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 1y;
        try_files $uri =404;
    }
}
